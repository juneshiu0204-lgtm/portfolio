<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件上传-填写信息 - 四维云行业通用软件</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1890ff',
                        header: '#ffffff',
                        sidebar: '#001529',
                        main: '#f0f2f5',
                        border: '#e8e8e8'
                    }
                }
            }
        }
    </script>
    <style>
        body { min-width: 1200px; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .custom-input {
            border: 1px solid #d9d9d9;
            border-radius: 2px;
            transition: all 0.3s;
        }
        .custom-input:focus {
            border-color: #40a9ff;
            box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.2);
            outline: none;
        }
        .custom-label {
            width: 100px;
            color: rgba(0, 0, 0, 0.85);
            font-size: 14px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        /* 步骤条样式 */
        .step-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            flex: 1;
        }
        .step-circle {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid #d9d9d9;
            background-color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #999;
            z-index: 2;
            transition: all 0.3s;
        }
        .step-item.completed .step-circle {
            background-color: #52c41a;
            border-color: #52c41a;
            color: #fff;
        }
        .step-item.active .step-circle {
            background-color: #1890ff;
            border-color: #1890ff;
            color: #fff;
        }
        .step-line {
            position: absolute;
            top: 14px;
            left: calc(50% + 20px);
            right: calc(-50% + 12px);
            height: 2px;
            background-color: #d9d9d9;
            z-index: 1;
        }
        .step-item.completed .step-line,
        .step-item.active ~ .step-item.completed .step-line {
            background-color: #52c41a;
        }
        .step-text {
            margin-top: 8px;
            font-size: 13px;
            color: #999;
        }
        .step-item.active .step-text,
        .step-item.completed .step-text {
            color: #333;
        }
    </style>
</head>
<body class="h-screen flex flex-col font-sans text-sm text-gray-700 bg-main overflow-hidden">

    <!-- 顶部：头部导航 -->
    <header class="h-16 bg-header text-gray-800 flex items-center justify-between px-6 flex-shrink-0 shadow-sm z-20 border-b border-gray-200">
        <div class="flex items-center gap-2.5 w-72">
            <div class="w-10 h-10 text-primary flex items-center justify-center text-[34px]">
                <i class="fa-solid fa-earth-americas"></i>
            </div>
            <div class="flex flex-col justify-center">
                <span class="text-[17px] font-black tracking-wide text-gray-800 leading-tight">四维云行业通用软件</span>
                <span class="text-[11px] font-bold tracking-[0.25em] text-gray-800 leading-tight mt-0.5">时空数据管理</span>
            </div>
        </div>

        <nav class="flex-1 px-8 h-full">
            <ul class="flex h-full items-center gap-10 font-medium text-[16px]">
                <li class="h-full flex items-center text-primary cursor-pointer px-3 border-b-2 border-primary bg-blue-50/50 transition-colors font-semibold">数据汇聚</li>
                <li class="h-full flex items-center text-gray-600 hover:text-primary cursor-pointer px-3 border-b-2 border-transparent hover:border-primary transition-colors">数据管理</li>
                <li class="h-full flex items-center text-gray-600 hover:text-primary cursor-pointer px-3 border-b-2 border-transparent hover:border-primary transition-colors">数据查询</li>
                <li class="h-full flex items-center text-gray-600 hover:text-primary cursor-pointer px-3 border-b-2 border-transparent hover:border-primary transition-colors">数据处理</li>
                <li class="h-full flex items-center text-gray-600 hover:text-primary cursor-pointer px-3 border-b-2 border-transparent hover:border-primary transition-colors">服务管理</li>
                <li class="h-full flex items-center text-gray-600 hover:text-primary cursor-pointer px-3 border-b-2 border-transparent hover:border-primary transition-colors">数据可视化</li>
            </ul>
        </nav>

        <div class="flex items-center gap-6">
            <a href="#" class="text-primary transition-colors flex items-center gap-1.5 text-[14px]">
                更多 <i class="fa-solid fa-angle-down text-[10px]"></i>
            </a>
            <div class="flex items-center gap-3 cursor-pointer hover:bg-gray-50 py-1.5 px-3 rounded-full border border-transparent hover:border-gray-200 transition-all">
                <span class="text-gray-700 font-medium text-[14px]">admin</span>
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Admin" alt="User" class="w-7 h-7 rounded-full bg-gray-200 border border-gray-300 shadow-sm">
            </div>
        </div>
    </header>

    <!-- CONTENT WRAPPER -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- LEFT: Sidebar -->
        <aside class="w-64 bg-sidebar text-gray-300 border-r border-gray-800 flex flex-col flex-shrink-0 z-10 shadow-lg overflow-y-auto">
            <div class="py-4">
                <ul class="flex flex-col w-full">
                    
                    <li class="w-full">
                        <a href="#" class="flex items-center px-6 py-4 hover:text-white transition-colors group">
                            <i class="fa-solid fa-tasks w-5 text-center text-gray-400 group-hover:text-white mr-3"></i>
                            <span class="text-[14px] tracking-wide">汇聚任务</span>
                        </a>
                    </li>

                    <li class="w-full">
                        <div class="flex items-center justify-between px-6 py-4 hover:text-white cursor-pointer transition-colors group">
                            <div class="flex items-center gap-3">
                                <i class="fa-solid fa-upload w-5 text-center text-gray-400 group-hover:text-white"></i>
                                <span class="text-[14px] tracking-wide">文件上传</span>
                            </div>
                        </div>
                    </li>

                    <li class="w-full">
                        <a href="#" class="flex items-center px-6 py-4 hover:text-white transition-colors group">
                            <i class="fa-solid fa-download w-5 text-center text-gray-400 group-hover:text-white mr-3"></i>
                            <span class="text-[14px] tracking-wide">数据下载</span>
                        </a>
                    </li>

                </ul>
            </div>
        </aside>

        <!-- MAIN: Content Area -->
        <main class="flex-1 overflow-y-auto p-4 md:p-6 scroll-smooth bg-[#f0f2f5] relative">
            
            <!-- 列表页面内容 -->
            <div class="mb-5 flex items-center justify-between">
                <div>
                    <h1 class="text-xl font-bold text-gray-800">文件上传列表</h1>
                </div>
                <button onclick="openModal()" class="bg-primary hover:bg-blue-600 text-white px-4 py-1.5 rounded text-xs flex items-center shadow-sm transition-colors">
                    <i class="fa-solid fa-upload mr-1.5"></i> 上传
                </button>
            </div>

            <!-- 列表占位 -->
            <div class="bg-white rounded-md shadow-sm border border-gray-200 min-h-[500px] flex items-center justify-center">
                <div class="text-center text-gray-400">
                    <i class="fa-regular fa-folder-open text-4xl mb-3 block"></i>
                    <span class="text-[14px]">暂无上传记录</span>
                </div>
            </div>

        </main>
    </div>

    <!-- 弹窗 -->
    <div id="uploadModal" class="modal-overlay hidden">
        <div class="bg-white rounded-md shadow-xl w-[600px] max-h-[90vh] overflow-hidden">
            
            <!-- 弹窗标题 -->
            <div class="px-6 py-4 border-b border-gray-200 flex items-center justify-between">
                <h3 class="text-[15px] font-semibold text-gray-800">数据上传</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-lg leading-none">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- 步骤条 -->
            <div class="px-8 pt-6 pb-4">
                <div class="flex items-start">
                    <div class="step-item completed">
                        <div class="step-circle"><i class="fa-solid fa-check text-[11px]"></i></div>
                        <div class="step-line"></div>
                        <div class="step-text">选择数据类型</div>
                    </div>
                    <div class="step-item completed">
                        <div class="step-circle"><i class="fa-solid fa-check text-[11px]"></i></div>
                        <div class="step-line"></div>
                        <div class="step-text">附件数据文件</div>
                    </div>
                    <div class="step-item active">
                        <div class="step-circle">3</div>
                        <div class="step-line"></div>
                        <div class="step-text">信息填写</div>
                    </div>
                    <div class="step-item">
                        <div class="step-circle">4</div>
                        <div class="step-text">数据上传</div>
                    </div>
                </div>
            </div>

            <!-- 表单区域 -->
            <div class="p-6 space-y-5 max-h-[50vh] overflow-y-auto">
                
                <div class="flex items-center">
                    <label class="custom-label flex-shrink-0">数据目录<span class="text-red-500 ml-1">*</span></label>
                    <div class="relative flex-1">
                        <select class="w-full h-9 px-3 pr-8 custom-input text-[14px] appearance-none bg-white">
                            <option value="">请选择</option>
                            <option value="/矢量数据/城市建筑">/矢量数据/城市建筑</option>
                            <option value="/影像数据/卫星图">/影像数据/卫星图</option>
                            <option value="/地形数据/DEM">/地形数据/DEM</option>
                        </select>
                        <i class="fa-solid fa-angle-down absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none text-[10px]"></i>
                    </div>
                </div>

                <div class="flex items-center">
                    <label class="custom-label flex-shrink-0">字符集<span class="text-red-500 ml-1">*</span></label>
                    <div class="relative flex-1">
                        <select class="w-full h-9 px-3 pr-8 custom-input text-[14px] appearance-none bg-white">
                            <option value="Apache-2.0">请选择</option>
                            <option value="CC-BY-4.0">UTF-8</option>
                            <option value="ODbL">GBK</option>
                            <option value="Apache-2.0">ISO-8859-1</option>
                            <option value="Apache-2.0">GB2312</option>
                        </select>
                        <i class="fa-solid fa-angle-down absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none text-[10px]"></i>
                    </div>
                </div>

                <div class="flex items-center">
                    <label class="custom-label flex-shrink-0">资产标签</label>
                    <div class="relative flex-1">
                        <select class="w-full h-9 px-3 pr-8 custom-input text-[14px] appearance-none bg-white">
                            <option value="">请选择</option>
                            <option value="建筑">建筑</option>
                            <option value="城市">城市</option>
                            <option value="矢量">矢量</option>
                            <option value="基础数据">基础数据</option>
                        </select>
                        <i class="fa-solid fa-angle-down absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none text-[10px]"></i>
                    </div>
                </div>

                <div class="flex items-start">
                    <label class="custom-label flex-shrink-0 pt-2">备注</label>
                    <input type="text" placeholder="请输入描述信息" class="flex-1 h-9 px-3 custom-input text-[14px]">
                </div>

                <!-- 入库到PostGIS库 -->
                <div class="flex items-start border-t border-dashed border-gray-200 pt-5">
                    <label class="custom-label flex-shrink-0 pt-0.5">入库目标</label>
                    <div class="flex-1">
                        <label class="flex items-center gap-2 cursor-pointer mb-2">
                            <input type="checkbox" id="enablePostGIS" checked class="w-4 h-4 rounded border-gray-300 text-primary focus:ring-primary cursor-pointer">
                            <span class="text-[14px] text-gray-700 font-medium">入库到PostGIS库</span>
                        </label>
                        <p class="help-text flex items-center gap-1 ml-6">
                            <i class="fa-solid fa-circle-info text-gray-400"></i>
                            入库到PostGIS库将不保存原始Shapefile/GeoJSON文件
                        </p>
                    </div>
                </div>

                <!-- PostGIS配置区域 -->
                <div id="postgisConfig" class="space-y-5 pl-[100px]">
                    
                    <div class="flex items-center">
                        <label class="custom-label flex-shrink-0">数据库<span class="text-red-500 ml-1">*</span></label>
                        <div class="relative flex-1">
                            <select id="databaseSelect" class="w-full h-9 px-3 pr-8 custom-input text-[14px] appearance-none bg-white">
                                <option value="">请选择</option>
                                <option value="siwei_spatial">siwei_spatial</option>
                                <option value="swc">swc</option>
                            </select>
                            <i class="fa-solid fa-angle-down absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none text-[10px]"></i>
                        </div>
                    </div>

                    <div class="flex items-center">
                        <label class="custom-label flex-shrink-0">Schema<span class="text-red-500 ml-1">*</span></label>
                        <div class="relative flex-1">
                            <select id="schemaSelect" class="w-full h-9 px-3 pr-8 custom-input text-[14px] appearance-none bg-white">
                                <option value="">请选择</option>
                                <option value="public">public</option> 
                            </select>
                            <i class="fa-solid fa-angle-down absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none text-[10px]"></i>
                        </div>
                    </div>

                </div>

            </div>

            <!-- 底部按钮 -->
            <div class="px-6 py-4 border-t border-gray-100 flex justify-end gap-3">
                <button onclick="closeModal()" class="px-5 py-1.5 bg-white border border-gray-300 rounded-[2px] text-[13px] text-gray-700 hover:bg-gray-50 transition-all">
                    取消
                </button>
                <button class="px-5 py-1.5 bg-white border border-gray-300 rounded-[2px] text-[13px] text-gray-700 hover:bg-gray-50 transition-all">
                    上一步
                </button>
                <button class="px-5 py-1.5 bg-primary hover:bg-blue-600 text-white rounded-[2px] text-[13px] transition-all shadow-sm">
                    确认
                </button>
            </div>

        </div>
    </div>

    <script>
        function openModal() {
            document.getElementById('uploadModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('uploadModal').classList.add('hidden');
        }

        document.getElementById('uploadModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // 入库到PostGIS库 复选框控制逻辑
        const enablePostGIS = document.getElementById('enablePostGIS');
        const postgisConfig = document.getElementById('postgisConfig');
        const databaseSelect = document.getElementById('databaseSelect');
        const schemaSelect = document.getElementById('schemaSelect');

        // 初始化状态
        updatePostGISState();

        enablePostGIS.addEventListener('change', function() {
            updatePostGISState();
        });

        function updatePostGISState() {
            if (enablePostGIS.checked) {
                postgisConfig.style.opacity = '1';
                postgisConfig.style.pointerEvents = 'auto';
                databaseSelect.disabled = false;
                databaseSelect.classList.remove('opacity-50', 'cursor-not-allowed', 'bg-gray-100');
                schemaSelect.disabled = false;
                schemaSelect.classList.remove('opacity-50', 'cursor-not-allowed', 'bg-gray-100');
            } else {
                postgisConfig.style.opacity = '0.4';
                postgisConfig.style.pointerEvents = 'none';
                databaseSelect.disabled = true;
                databaseSelect.classList.add('opacity-50', 'cursor-not-allowed', 'bg-gray-100');
                schemaSelect.disabled = true;
                schemaSelect.classList.add('opacity-50', 'cursor-not-allowed', 'bg-gray-100');
            }
        }
    </script>

</body>
</html>
