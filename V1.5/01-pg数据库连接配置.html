<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据存储管理 - 时空数据管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1890ff',
                        header: '#ffffff',
                        sidebar: '#001529',
                        main: '#f0f2f5',
                        border: '#e8e8e8'
                    }
                }
            }
        }
    </script>
    <style>
        body { min-width: 1200px; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .custom-input {
            border: 1px solid #d9d9d9;
            border-radius: 2px;
            transition: all 0.3s;
        }
        .custom-input:focus {
            border-color: #40a9ff;
            box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.2);
            outline: none;
        }
        
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
    </style>
</head>
<body class="h-screen flex flex-col font-sans text-sm text-gray-700 bg-main overflow-hidden">

    <header class="h-16 bg-header text-gray-800 flex items-center justify-between px-6 flex-shrink-0 shadow-sm z-20 border-b border-gray-200">
        <div class="flex items-center gap-2.5 w-72">
            <div class="w-10 h-10 text-primary flex items-center justify-center text-[34px]">
                <i class="fa-solid fa-earth-americas"></i>
            </div>
            <div class="flex flex-col justify-center">
                <span class="text-[17px] font-black tracking-wide text-gray-800 leading-tight">四维云行业通用软件</span>
                <span class="text-[11px] font-bold tracking-[0.25em] text-gray-800 leading-tight mt-0.5">控制台</span>
            </div>
        </div>

        <nav class="flex-1 px-8 h-full">
            <ul class="flex h-full items-center gap-10 font-medium text-[16px]">
                <li class="h-full flex items-center text-gray-600 hover:text-primary cursor-pointer px-3 border-b-2 border-transparent hover:border-primary transition-colors">用户管理</li>
                <li class="h-full flex items-center text-gray-600 hover:text-primary cursor-pointer px-3 border-b-2 border-transparent hover:border-primary transition-colors">许可管理</li>
                <li class="h-full flex items-center text-primary cursor-pointer px-3 border-b-2 border-primary bg-blue-50/50 transition-colors font-semibold">设置</li>
            </ul>
        </nav>

        <div class="flex items-center gap-6">
            <a href="#" class="text-primary transition-colors flex items-center gap-1.5 text-[14px]">
            更多 <i class="fa-solid fa-angle-down text-[10px]"></i>
            </a>
            <div class="flex items-center gap-3 cursor-pointer hover:bg-gray-50 py-1.5 px-3 rounded-full border border-transparent hover:border-gray-200 transition-all">
                <span class="text-gray-700 font-medium text-[14px]">admin</span>
                <i class="fa-solid fa-user-circle text-[18px] text-gray-400"></i>
            </div>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        
        <aside class="w-64 bg-sidebar text-gray-300 flex flex-col flex-shrink-0 z-10 shadow-lg overflow-y-auto">
            <div class="py-4">
                <ul class="flex flex-col w-full">
                    
                    <li class="w-full">
                        <a href="#" class="flex items-center px-6 py-4 hover:text-white transition-colors group">
                            <i class="fa-solid fa-folder-open w-5 text-center text-gray-400 group-hover:text-white mr-3"></i>
                            <span class="text-[14px] tracking-wide">标签管理</span>
                        </a>
                    </li>

                    <li class="w-full">
                        <a href="#" class="flex items-center px-6 py-4 hover:text-white transition-colors group">
                            <i class="fa-solid fa-folder-open w-5 text-center text-gray-400 group-hover:text-white mr-3"></i>
                            <span class="text-[14px] tracking-wide">自定义参数</span>
                        </a>
                    </li>

                    <li class="w-full">
                        <a href="#" class="flex items-center px-6 py-4 hover:text-white transition-colors group">
                            <i class="fa-solid fa-folder-open w-5 text-center text-gray-400 group-hover:text-white mr-3"></i>
                            <span class="text-[14px] tracking-wide">底图管理</span>
                        </a>
                    </li>

                    <li class="w-full">
                        <div class="flex items-center justify-between px-6 py-4 hover:text-white cursor-pointer transition-colors group">
                            <div class="flex items-center gap-3">
                                <i class="fa-solid fa-cloud w-5 text-center text-gray-400 group-hover:text-white"></i>
                                <span class="text-[14px] tracking-wide">自定义参数</span>
                            </div>
                            <i class="fa-solid fa-angle-up text-xs text-gray-400"></i>
                        </div>
                    </li>

                    <li class="w-full">
                        <a href="#" class="block pl-[52px] pr-6 py-3 text-[14px] text-gray-400 hover:text-white hover:bg-primary/10 transition-colors">计算引擎</a>
                    </li>

                    <li class="w-full">
                        <a href="#" class="block pl-[52px] pr-6 py-3 text-[14px] text-white bg-primary/30 border-r-4 border-primary font-medium">数据存储</a>
                    </li>

                </ul>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto p-6 flex flex-col relative">
            
            <div class="bg-white rounded-sm shadow-sm border border-gray-200 flex flex-col min-h-full">
                
                <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
                    <h2 class="text-[16px] font-bold text-gray-800">数据存储管理</h2>
                    <button onclick="openModal()" class="bg-primary hover:bg-blue-600 text-white px-4 py-1.5 rounded-[2px] text-[13px] transition-all shadow-sm flex items-center gap-1">
                        <i class="fa-solid fa-plus text-[11px]"></i> 新增
                    </button>
                </div>

                <div class="p-6 space-y-4">
                    
                    <div class="flex items-center gap-4">
                        <div class="flex items-center gap-2">
                            <label class="text-[13px] text-gray-600 whitespace-nowrap">存储资源类型</label>
                            <select class="h-8 px-3 custom-input text-[13px] w-32 appearance-none bg-white">
                                <option>请选择</option>
                                <option selected>PostGIS</option>
                                <option>MySQL</option>
                                <option>Oracle</option>
                                <option>……</option>
                            </select>
                        </div>
                        
                        <div class="flex items-center gap-2">
                            <label class="text-[13px] text-gray-600 whitespace-nowrap">存储资源名称</label>
                            <input type="text" placeholder="请输入" class="h-8 px-3 custom-input text-[13px] w-48">
                            <button class="text-gray-400 hover:text-gray-600">
                                <i class="fa-solid fa-search"></i>
                            </button>
                        </div>

                        <button class="bg-primary hover:bg-blue-600 text-white px-4 py-1 rounded-[2px] text-[13px] transition-all shadow-sm">
                            搜索
                        </button>
                        <button class="bg-white hover:bg-gray-50 text-gray-600 px-4 py-1 border border-gray-300 rounded-[2px] text-[13px] transition-all">
                            重置
                        </button>
                    </div>

                    <div class="border border-gray-200 rounded-sm overflow-hidden">
                        <table class="w-full text-[13px]">
                            <thead class="bg-gray-50 border-b border-gray-200">
                                <tr>
                                    <th class="px-4 py-3 text-left font-medium text-gray-700">数据行类型</th>
                                    <th class="px-4 py-3 text-left font-medium text-gray-700">数据行名称</th>
                                    <th class="px-4 py-3 text-left font-medium text-gray-700">数据行代码</th>
                                    <th class="px-4 py-3 text-left font-medium text-gray-700">创建人</th>
                                    <th class="px-4 py-3 text-left font-medium text-gray-700">创建时间</th>
                                    <th class="px-4 py-3 text-left font-medium text-gray-700">上次验证时间</th>
                                    <th class="px-4 py-3 text-left font-medium text-gray-700">状态显示</th>
                                    <th class="px-4 py-3 text-left font-medium text-gray-700">操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                
                            </tbody>
                        </table>
                        
                        <div class="py-12 flex flex-col items-center justify-center text-gray-400">
                            <i class="fa-regular fa-folder-open text-4xl mb-3"></i>
                            <span class="text-[13px]">暂无数据</span>
                        </div>
                    </div>

                    <div class="flex items-center justify-between pt-4">
                        <div class="text-[12px] text-gray-500">
                            共 0 条 &nbsp;&nbsp; 10条/页
                        </div>
                        <div class="flex items-center gap-2">
                            <button class="w-7 h-7 flex items-center justify-center border border-gray-300 rounded-sm text-gray-500 hover:border-primary hover:text-primary disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                                <i class="fa-solid fa-chevron-left text-[10px]"></i>
                            </button>
                            <input type="text" value="1" class="w-8 h-7 text-center border border-primary text-primary custom-input text-[13px]" readonly>
                            <button class="w-7 h-7 flex items-center justify-center border border-gray-300 rounded-sm text-gray-500 hover:border-primary hover:text-primary disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                                <i class="fa-solid fa-chevron-right text-[10px]"></i>
                            </button>
                            <span class="text-[12px] text-gray-500 ml-2">总 1 页</span>
                        </div>
                    </div>

                </div>
            </div>

            
            <div id="modal" class="modal-overlay hidden">
                <div class="bg-white rounded-md shadow-xl w-[520px] max-h-[90vh] overflow-hidden">
                    
                    <div class="px-6 py-4 border-b border-gray-200 flex items-center justify-between">
                        <h3 class="text-[15px] font-semibold text-gray-800">新建</h3>
                        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-lg leading-none">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>

                    <div class="p-6 space-y-5 max-h-[60vh] overflow-y-auto">

                        <div class="flex items-center">
                            <label class="w-28 text-[13px] text-gray-700 flex-shrink-0"><span class="text-red-500">*</span>数据存储类型</label>
                            <div class="relative flex-1">
                                <select class="w-full h-9 px-3 pr-8 custom-input text-[13px] appearance-none bg-white">
                                    <option selected>PostGIS</option>
                                    <option>MySQL</option>
                                    <option>Oracle</option>
                                </select>
                                <i class="fa-solid fa-angle-down absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none text-[10px]"></i>
                            </div>
                        </div>

                        <div class="flex items-center">
                            <label class="w-28 text-[13px] text-gray-700 flex-shrink-0"><span class="text-red-500">*</span>数据存储代码</label>
                            <input type="text" placeholder="请输入英文名称" class="flex-1 h-9 px-3 custom-input text-[13px]">
                        </div>

                        <div class="flex items-center">
                            <label class="w-28 text-[13px] text-gray-700 flex-shrink-0"><span class="text-red-500">*</span>数据存储名称</label>
                            <input type="text" placeholder="请输入中文名称" class="flex-1 h-9 px-3 custom-input text-[13px]">
                        </div>

                        <div class="flex items-center">
                            <label class="w-28 text-[13px] text-gray-700 flex-shrink-0"><span class="text-red-500">*</span>主机/IP</label>
                            <input type="text" class="flex-1 h-9 px-3 custom-input text-[13px]">
                        </div>

                        <div class="flex items-center">
                            <label class="w-28 text-[13px] text-gray-700 flex-shrink-0"><span class="text-red-500">*</span>端口号</label>
                            <input type="text" class="flex-1 h-9 px-3 custom-input text-[13px]">
                        </div>

                        <div class="flex items-center">
                            <label class="w-28 text-[13px] text-gray-700 flex-shrink-0"><span class="text-red-500">*</span>数据库</label>
                            <input type="text"  class="flex-1 h-9 px-3 custom-input text-[13px]">
                        </div>

                        <div class="flex items-center">
                            <label class="w-28 text-[13px] text-gray-700 flex-shrink-0"><span class="text-red-500">*</span>用户名</label>
                            <input type="text"  class="flex-1 h-9 px-3 custom-input text-[13px]">
                        </div>

                        <div class="flex items-center">
                            <label class="w-28 text-[13px] text-gray-700 flex-shrink-0">密码</label>
                            <input type="password" placeholder="" class="flex-1 h-9 px-3 custom-input text-[13px]">
                        </div>

                        <div class="flex items-center">
                            <label class="w-28 text-[13px] text-gray-700 flex-shrink-0"><span class="text-red-500">*</span>编码</label>
                            <div class="relative flex-1">
                                <select class="w-full h-9 px-3 pr-8 custom-input text-[13px] appearance-none bg-white">
                                    <option selected>请选择编码</option>
                                    <option>GBK</option>
                                    <option>UTF-8</option>
                                    <option>IOS-8859-1</option>
                                    <option>GB2312</option>
                                </select>
                                <i class="fa-solid fa-angle-down absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none text-[10px]"></i>
                            </div>
                        </div>

                        <div class="flex items-center">
                            <label class="w-28 text-[13px] text-gray-700 flex-shrink-0"><span class="text-red-500">*</span>模式</label>
                            <input type="text" class="flex-1 h-9 px-3 custom-input text-[13px]">
                        </div>

                        <div class="flex items-start">
                            <label class="w-28 text-[13px] text-gray-700 flex-shrink-0 pt-2">描述</label>
                            <textarea rows="4" placeholder="请输入描述信息" class="flex-1 px-3 py-2 custom-input text-[13px] resize-none"></textarea>
                        </div>

                        <div class="flex items-center">
                            <label class="w-28 text-[13px] text-gray-700 flex-shrink-0">连接认证</label>
                            <div class="flex-1 flex items-center gap-3">
                                <span class="inline-flex items-center px-2 py-0.5 rounded text-[12px] text-red-500 bg-red-50 border border-red-200">
                                    未测试
                                </span>
                                <button class="bg-primary hover:bg-blue-600 text-white px-3 py-1 rounded-[2px] text-[12px] transition-all shadow-sm">
                                    测试链接
                                </button>
                            </div>
                        </div>

                    </div>

                    <div class="px-6 py-4 border-t border-gray-100 flex justify-end gap-3">
                        <button onclick="closeModal()" class="px-5 py-1.5 bg-white border border-gray-300 rounded-[2px] text-[13px] text-gray-700 hover:bg-gray-50 transition-all">
                            取消
                        </button>
                        <button class="px-5 py-1.5 bg-primary hover:bg-blue-600 text-white rounded-[2px] text-[13px] transition-all shadow-sm">
                            确认
                        </button>
                    </div>

                </div>
            </div>

        </main>
    </div>

    <script>
        function openModal() {
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>

</body>
</html>
