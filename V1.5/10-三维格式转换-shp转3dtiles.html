<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shp 转 3dtiles</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1890ff',
                        header: '#ffffff',
                        sidebar: '#001529',
                        main: '#f0f2f5',
                        border: '#e8e8e8'
                    }
                }
            }
        }
    </script>
    <style>
        body { min-width: 1200px; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .custom-input {
            border: 1px solid #d9d9d9;
            border-radius: 2px;
            transition: all 0.3s;
        }
        .custom-input:focus {
            border-color: #40a9ff;
            box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.2);
            outline: none;
        }
        .custom-label {
            width: 140px;
            color: rgba(0, 0, 0, 0.85);
            font-size: 14px;
        }
        
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 22px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.3s;
            border-radius: 22px;
        }
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }
        input:checked + .toggle-slider {
            background-color: #1890ff;
        }
        input:checked + .toggle-slider:before {
            transform: translateX(22px);
        }
        
        .help-text {
            color: rgba(0, 0, 0, 0.45);
            font-size: 12px;
            margin-top: 4px;
        }
        
        .yellow-note {
            background-color: #fffbe6;
            border: 1px solid #ffe58f;
            padding: 12px;
            border-radius: 2px;
            font-size: 13px;
            line-height: 1.8;
        }
        .yellow-note ul {
            margin: 0;
            padding-left: 20px;
        }
        .yellow-note li {
            margin-bottom: 4px;
        }
    </style>
</head>
<body class="h-screen flex flex-col font-sans text-sm text-gray-700 bg-main overflow-hidden">

    <header class="h-16 bg-header text-gray-800 flex items-center justify-between px-6 flex-shrink-0 shadow-sm z-20 border-b border-gray-200">
        <div class="flex items-center gap-2.5 w-72">
            <div class="w-10 h-10 text-primary flex items-center justify-center text-[34px]">
                <i class="fa-solid fa-earth-americas"></i>
            </div>
            <div class="flex flex-col justify-center">
                <span class="text-[17px] font-black tracking-wide text-gray-800 leading-tight">四维云行业通用软件</span>
                <span class="text-[11px] font-bold tracking-[0.25em] text-gray-800 leading-tight mt-0.5">时空数据管理</span>
            </div>
        </div>

        <nav class="flex-1 px-8 h-full">
            <ul class="flex h-full items-center gap-10 font-medium text-[16px]">
                <li class="h-full flex items-center text-gray-600 hover:text-primary cursor-pointer px-3 border-b-2 border-transparent hover:border-primary transition-colors">数据汇聚</li>
                <li class="h-full flex items-center text-gray-600 hover:text-primary cursor-pointer px-3 border-b-2 border-transparent hover:border-primary transition-colors">数据管理</li>
                <li class="h-full flex items-center text-gray-600 hover:text-primary cursor-pointer px-3 border-b-2 border-transparent hover:border-primary transition-colors">数据查询</li>
                <li class="h-full flex items-center text-primary cursor-pointer px-3 border-b-2 border-primary bg-blue-50/50 transition-colors font-semibold">数据处理</li>
                <li class="h-full flex items-center text-gray-600 hover:text-primary cursor-pointer px-3 border-b-2 border-transparent hover:border-primary transition-colors">服务管理</li>
                <li class="h-full flex items-center text-gray-600 hover:text-primary cursor-pointer px-3 border-b-2 border-transparent hover:border-primary transition-colors">数据可视化</li>
            </ul>
        </nav>

        <div class="flex items-center gap-6">
            <a href="#" class="text-primary transition-colors flex items-center gap-1.5 text-[14px]">
                更多 <i class="fa-solid fa-angle-down text-[10px]"></i>
            </a>
            <div class="flex items-center gap-3 cursor-pointer hover:bg-gray-50 py-1.5 px-3 rounded-full border border-transparent hover:border-gray-200 transition-all">
                <span class="text-gray-700 font-medium text-[14px]">admin</span>
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Admin" alt="User" class="w-7 h-7 rounded-full bg-gray-200 border border-gray-300 shadow-sm">
            </div>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        
        <aside class="w-64 bg-sidebar text-gray-300 flex flex-col flex-shrink-0 z-10 shadow-lg overflow-y-auto">
            <div class="py-4">
                <ul class="flex flex-col w-full">
                    
                    <li class="w-full">
                        <div class="flex items-center justify-between px-6 py-4 hover:text-white cursor-pointer transition-colors group">
                            <div class="flex items-center gap-3">
                                <i class="fa-solid fa-layer-group w-5 text-center text-gray-400 group-hover:text-white transition-colors"></i>
                                <span class="text-[16px] tracking-wide">数据切片</span>
                            </div>
                            <i class="fa-solid fa-angle-down text-xs text-gray-500 group-hover:text-gray-300"></i>
                        </div>
                        <ul class="hidden bg-[#000c17] py-1">
                            <li><a href="#" class="block pl-[52px] pr-6 py-3 text-[14px] text-gray-400 hover:text-white hover:bg-primary/10 transition-colors">影像数据切片</a></li>
                            <li><a href="#" class="block pl-[52px] pr-6 py-3 text-[14px] text-gray-400 hover:text-white hover:bg-primary/10 transition-colors">地形数据切片</a></li>
                        </ul>
                    </li>

                    <li class="w-full">
                        <div class="flex items-center justify-between px-6 py-4 hover:text-white cursor-pointer transition-colors group">
                            <div class="flex items-center gap-3">
                                <i class="fa-solid fa-crop-simple w-5 text-center text-gray-400 group-hover:text-white transition-colors"></i>
                                <span class="text-[16px] tracking-wide">数据裁切</span>
                            </div>
                            <i class="fa-solid fa-angle-down text-xs text-gray-500 group-hover:text-gray-300"></i>
                        </div>
                        <ul class="hidden bg-[#000c17] py-1">
                            <li><a href="#" class="block pl-[52px] pr-6 py-3 text-[14px] text-gray-400 hover:text-white hover:bg-primary/10 transition-colors">影像数据裁切</a></li>
                        </ul>
                    </li>

                    <li class="w-full">
                        <div class="flex items-center justify-between px-6 py-4 hover:text-white cursor-pointer transition-colors group">
                            <div class="flex items-center gap-3">
                                <i class="fa-solid fa-bolt w-5 text-center text-gray-400 group-hover:text-white transition-colors"></i>
                                <span class="text-[16px] tracking-wide">坐标处理</span>
                            </div>
                            <i class="fa-solid fa-angle-down text-xs text-gray-500 group-hover:text-gray-300"></i>
                        </div>
                        <ul class="hidden bg-[#000c17] py-1">
                            <li><a href="#" class="block pl-[52px] pr-6 py-3 text-[14px] text-gray-400 hover:text-white hover:bg-primary/10 transition-colors">坐标转换</a></li>
                            <li><a href="#" class="block pl-[52px] pr-6 py-3 text-[14px] text-gray-400 hover:text-white hover:bg-primary/10 transition-colors">定义投影</a></li>
                        </ul>
                    </li>

                    <li class="w-full">
                        <div class="flex items-center justify-between px-6 py-4 text-white cursor-pointer transition-colors">
                            <div class="flex items-center gap-3">
                                <i class="fa-solid fa-code-compare w-5 text-center text-primary"></i>
                                <span class="text-[16px] tracking-wide font-medium">格式转换</span>
                            </div>
                            <i class="fa-solid fa-angle-up text-xs text-gray-400"></i>
                        </div>
                        <ul class="bg-[#000c17] py-2">
                            <li><a href="#" class="block pl-[52px] pr-6 py-3 text-[14px] text-gray-400 hover:text-white hover:bg-primary/10 transition-colors">影像格式转换</a></li>
                            <li>
                                <div class="pl-[52px] pr-6 py-3 text-[14px] text-primary bg-primary/10 border-r-4 border-primary cursor-pointer font-medium tracking-wide">
                                    矢量格式转换
                                </div>
                            </li>
                            <li><a href="#" class="block pl-[52px] pr-6 py-3 text-[14px] text-gray-400 hover:text-white hover:bg-primary/10 transition-colors">三维格式转换</a></li>
                        </ul>
                    </li>

                </ul>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto p-4 flex flex-col">
            
            <div class="flex-1 bg-white rounded-sm shadow-sm border border-gray-200 flex flex-col">
                <div class="px-6 py-4 border-b border-gray-100">
                    <h2 class="text-[16px] font-bold text-gray-800">新建任务</h2>
                </div>

                <div class="flex-1 p-8 overflow-y-auto">
                    <div class="max-w-5xl">
                        <form class="space-y-6">
                            
                            <div class="space-y-6 pb-6 border-b border-gray-100">
                                <div class="flex items-center">
                                    <label class="custom-label flex-shrink-0">输出数据名称<span class="text-red-500 ml-1">*</span></label>
                                    <input type="text" placeholder="请输入" class="w-[360px] h-9 px-3 custom-input text-[14px]">
                                </div>

                                <div class="flex items-center">
                                    <label class="custom-label flex-shrink-0">输入数据<span class="text-red-500 ml-1">*</span></label>
                                    <input type="text" value="/影像数据/全国影像数据.shp" disabled class="w-[360px] h-9 px-3 custom-input bg-gray-50 text-gray-400 cursor-not-allowed text-[14px]">
                                </div>

                                <div class="flex items-center">
                                    <label class="custom-label flex-shrink-0">输出数据目录<span class="text-red-500 ml-1">*</span></label>
                                    <div class="relative w-[360px]">
                                        <select class="w-full h-9 pl-3 pr-8 custom-input bg-white appearance-none text-[14px] text-gray-400">
                                            <option>请选择</option>
                                        </select>
                                        <i class="fa-solid fa-angle-down absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none text-[10px]"></i>
                                    </div>
                                </div>

                                <div class="flex items-center">
                                    <label class="custom-label flex-shrink-0">资产标签</label>
                                    <input type="text" value="栅格数据" disabled class="w-[360px] h-9 px-3 custom-input bg-gray-50 text-gray-400 cursor-not-allowed text-[14px]">
                                </div>

                                <div class="flex items-center">
                                    <label class="custom-label flex-shrink-0">输出数据格式</label>
                                    <input type="text" value="Cesium 3DTiles" disabled class="w-[360px] h-9 px-3 custom-input bg-gray-50 text-gray-400 cursor-not-allowed text-[14px]">
                                </div>
                            </div>

                            <div class="space-y-6 pt-2">
                                <div class="flex items-center">
                                    <label class="custom-label flex-shrink-0">拉伸高度字段<span class="text-red-500 ml-1">*</span></label>
                                    <div class="flex items-center gap-2">
                                        <div class="relative w-[360px]">
                                            <select class="w-full h-9 pl-3 pr-8 custom-input bg-white appearance-none text-[14px]">
                                                <option>请选择</option>
                                                <option>height</option>
                                                <option>elevation</option>
                                                <option>altitude</option>
                                            </select>
                                            <i class="fa-solid fa-angle-down absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none text-[10px]"></i>
                                        </div>
                                        <span class="text-gray-500 text-[14px]">×</span>
                                        <input type="number" value="1" class="w-20 h-9 px-3 custom-input text-[14px] text-center">
                                    </div>
                                </div>

                                <div class="flex items-center">
                                    <label class="custom-label flex-shrink-0">LOD 模式</label>
                                    <label class="toggle-switch">
                                        <input type="checkbox">
                                        <span class="toggle-slider"></span>
                                    </label>
                                </div>

                                <div class="flex items-center">
                                    <label class="custom-label flex-shrink-0">网格简化</label>
                                    <label class="toggle-switch">
                                        <input type="checkbox">
                                        <span class="toggle-slider"></span>
                                    </label>
                                    <span class="help-text ml-2">
                                        <i class="fa-solid fa-circle-info text-gray-400 mr-1"></i>
                                        在保持视觉质量的同时减少多边形数量。
                                    </span>
                                </div>

                                <div class="flex items-center">
                                    <label class="custom-label flex-shrink-0">Draco 网格压缩</label>
                                    <label class="toggle-switch">
                                        <input type="checkbox">
                                        <span class="toggle-slider"></span>
                                    </label>
                                    <span class="help-text ml-2">
                                        <i class="fa-solid fa-circle-info text-gray-400 mr-1"></i>
                                        减小存储量，但有精度损失。
                                    </span>
                                </div>
                            </div>

                        </form>
                    </div>
                </div>

                <div class="px-8 py-6 border-t border-gray-100 bg-white">
                    <div class="flex gap-4">
                        <button class="bg-primary hover:bg-blue-600 text-white px-8 py-1.5 rounded-[2px] text-[14px] transition-all shadow-sm">
                            确认
                        </button>
                        <button class="bg-white hover:bg-gray-50 text-gray-600 px-8 py-1.5 border border-gray-300 rounded-[2px] text-[14px] transition-all">
                            取消
                        </button>
                    </div>
                </div>
            </div>

        </main>
    </div>

</body>
</html>
