<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新建任务 - 四维云行业通用软件</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1890ff',
                        header: '#ffffff',
                        sidebar: '#001529',
                        main: '#f0f2f5',
                        border: '#e8e8e8'
                    }
                }
            }
        }
    </script>
    <style>
        body { min-width: 1200px; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .custom-input {
            border: 1px solid #d9d9d9;
            border-radius: 2px;
            transition: all 0.3s;
        }
        .custom-input:focus {
            border-color: #40a9ff;
            box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.2);
            outline: none;
        }
        .custom-label {
            width: 100px;
            color: rgba(0, 0, 0, 0.85);
            font-size: 14px;
        }

        .help-text {
            color: rgba(0, 0, 0, 0.45);
            font-size: 12px;
            margin-top: 4px;
        }

        /* Tab 页样式 */
        .tab-container {
            display: inline-flex;
            border-bottom: none;
            margin-bottom: 0;
        }
        .tab {}
        .tab-item {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            background: #fff;
            color: rgba(0, 0, 0, 0.45);
            border: 1px solid #d9d9d9;
            border-bottom: 1px solid #d9d9d9;
        }
        .tab-item:first-child {
            border-radius: 2px 0 0 2px;
        }
        .tab-item:last-child {
            border-radius: 0 2px 2px 0;
        }
        .tab-item:not(:last-child) {
            border-right: none;
        }
        .tab-item:hover {
            color: #1890ff;
        }
        .tab-item.active {
            background-color: #1890ff;
            color: #fff;
            border-color: #1890ff;
            font-weight: 500;
        }
    </style>
</head>
<body class="h-screen flex flex-col font-sans text-sm text-gray-700 bg-main overflow-hidden">

    <!-- 顶部：头部导航 -->
    <header class="h-16 bg-header text-gray-800 flex items-center justify-between px-6 flex-shrink-0 shadow-sm z-20 border-b border-gray-200">
        <div class="flex items-center gap-2.5 w-72">
            <div class="w-10 h-10 text-primary flex items-center justify-center text-[34px]">
                <i class="fa-solid fa-earth-americas"></i>
            </div>
            <div class="flex flex-col justify-center">
                <span class="text-[17px] font-black tracking-wide text-gray-800 leading-tight">四维云行业通用软件</span>
                <span class="text-[11px] font-bold tracking-[0.25em] text-gray-800 leading-tight mt-0.5">时空数据管理</span>
            </div>
        </div>

        <nav class="flex-1 px-8 h-full">
            <ul class="flex h-full items-center gap-10 font-medium text-[16px]">
                <li class="h-full flex items-center text-primary cursor-pointer px-3 border-b-2 border-primary bg-blue-50/50 transition-colors font-semibold">数据汇聚</li>
                <li class="h-full flex items-center text-gray-600 hover:text-primary cursor-pointer px-3 border-b-2 border-transparent hover:border-primary transition-colors">数据管理</li>
                <li class="h-full flex items-center text-gray-600 hover:text-primary cursor-pointer px-3 border-b-2 border-transparent hover:border-primary transition-colors">数据查询</li>
                <li class="h-full flex items-center text-gray-600 hover:text-primary cursor-pointer px-3 border-b-2 border-transparent hover:border-primary transition-colors">数据处理</li>
                <li class="h-full flex items-center text-gray-600 hover:text-primary cursor-pointer px-3 border-b-2 border-transparent hover:border-primary transition-colors">服务管理</li>
                <li class="h-full flex items-center text-gray-600 hover:text-primary cursor-pointer px-3 border-b-2 border-transparent hover:border-primary transition-colors">数据可视化</li>
            </ul>
        </nav>

        <div class="flex items-center gap-6">
            <a href="#" class="text-primary transition-colors flex items-center gap-1.5 text-[14px]">
                更多 <i class="fa-solid fa-angle-down text-[10px]"></i>
            </a>
            <div class="flex items-center gap-3 cursor-pointer hover:bg-gray-50 py-1.5 px-3 rounded-full border border-transparent hover:border-gray-200 transition-all">
                <span class="text-gray-700 font-medium text-[14px]">admin</span>
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Admin" alt="User" class="w-7 h-7 rounded-full bg-gray-200 border border-gray-300 shadow-sm">
            </div>
        </div>
    </header>

    <!-- CONTENT WRAPPER -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- LEFT: Sidebar -->
        <aside class="w-64 bg-sidebar text-gray-300 border-r border-gray-800 flex flex-col flex-shrink-0 z-10 shadow-lg overflow-y-auto">
            <div class="py-4">
                <ul class="flex flex-col w-full">
                    
                    <li class="w-full">
                        <div class="flex items-center justify-between px-6 py-4 hover:text-white cursor-pointer transition-colors group">
                            <div class="flex items-center gap-3">
                                <i class="fa-solid fa-tasks w-5 text-center text-gray-400 group-hover:text-white"></i>
                                <span class="text-[14px] tracking-wide">汇聚任务</span>
                            </div>
                        </div>
                    </li>

                    <li class="w-full">
                        <a href="#" class="flex items-center px-6 py-4 hover:text-white transition-colors group">
                            <i class="fa-solid fa-upload w-5 text-center text-gray-400 group-hover:text-white mr-3"></i>
                            <span class="text-[14px] tracking-wide">文件上传</span>
                        </a>
                    </li>

                    <li class="w-full">
                        <a href="#" class="flex items-center px-6 py-4 hover:text-white transition-colors group">
                            <i class="fa-solid fa-download w-5 text-center text-gray-400 group-hover:text-white mr-3"></i>
                            <span class="text-[14px] tracking-wide">数据下载</span>
                        </a>
                    </li>

                </ul>
            </div>
        </aside>

        <!-- MAIN: Content Area -->
        <main class="flex-1 flex flex-col overflow-hidden bg-[#f0f2f5]">
            
            <!-- Breadcrumb / Page Title - 固定顶部 -->
            <div class="flex-shrink-0 mb-3 flex items-center justify-between p-4 md:p-6 pb-0">
                <div>
                    <h1 class="text-xl font-bold text-gray-800">新建任务</h1>
                </div>
                <button class="bg-white border border-gray-300 hover:bg-gray-50 text-gray-600 px-4 py-1.5 rounded text-xs flex items-center shadow-sm transition-colors">
                    <i class="fa-solid fa-arrow-left mr-1.5"></i> 返回
                </button>
            </div>

            <!-- 任务表单容器 - 包含可滚动内容和固定底部按钮 -->
            <div class="flex-1 flex flex-col overflow-hidden">
                <!-- 任务表单内容 - 可滚动区域 -->
                <section class="bg-white rounded-md shadow-sm border border-gray-200 flex-1 overflow-y-auto mb-0">
                    <div class="p-6 space-y-6">
                        

                        <!-- 任务名称 -->
                        <div class="flex items-center">
                            <label class="custom-label flex-shrink-0">任务名称<span class="text-red-500 ml-1">*</span></label>
                            <input type="text" placeholder="请输入任务名称" class="flex-1 h-9 px-3 custom-input text-[14px]">
                        </div>

                        <!-- 入库数据类型 -->
                        <div class="border-t border-dashed border-gray-200 pt-5 flex items-center gap-4">
                            <label class="custom-label flex-shrink-0 mb-0">入库数据类型</label>
                            <div class="tab-container">
                                <div class="tab">
                                    <div class="tab-item active" data-tab="file">以单个文件入库</div>
                                    <div class="tab-item" data-tab="db">以数据集形式入库</div>
                                </div>
                            </div>
                            <input type="hidden" name="import_type" value="file" id="importType">
                        </div>

                        <!-- 入库方式 -->
                        <div class="flex items-center">
                            <label class="custom-label flex-shrink-0">入库方式<span class="text-red-500 ml-1">*</span></label>
                            <div class="relative flex-1">
                                <select class="w-full h-9 px-3 pr-8 custom-input text-[14px] appearance-none bg-white">
                                    <option value="node1">虚拟入库</option>
                                    <option value="node2">实体入库</option>
                                </select>
                                <i class="fa-solid fa-angle-down absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none text-[10px]"></i>
                            </div>
                        </div>

                        <!-- 数据源 -->
                        <div class="flex items-center">
                            <label class="custom-label flex-shrink-0">物理数据位置<span class="text-red-500 ml-1">*</span></label>
                            <div class="flex-1 flex items-center">
                                <button class="bg-primary hover:bg-blue-600 text-white px-4 py-1.5 rounded text-sm transition-colors">
                                    选择数据
                                </button>
                                <i class="fa-solid fa-circle-info text-gray-400 ml-3 cursor-help"></i>
                            </div>
                        </div>

                        <!-- 入库数据源 -->
                        <div class="flex items-center">
                            <label class="custom-label flex-shrink-0">入库数据目录<span class="text-red-500 ml-1">*</span></label>
                            <div class="relative flex-1">
                                <select class="w-full h-9 px-3 pr-8 custom-input text-[14px] appearance-none bg-white">
                                    <option value="">请选择</option>
                                    <option value="siwei_spatial">默认目录</option>
                                    <option value="swc">时空数据</option>
                                </select>
                                <i class="fa-solid fa-angle-down absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none text-[10px]"></i>
                            </div>
                        </div>

                    
                        <!-- 检测格式 -->
                        <div class="flex items-start">
                            <label class="custom-label flex-shrink-0 pt-2">检测格式</label>
                            <div id="detectFormatContainer" class="flex-1 space-y-4">
                                 <div class="flex items-center gap-4">
                                     <label class="flex items-center gap-2 cursor-pointer border border-gray-300 rounded-md px-3 py-1.5 bg-white hover:border-primary hover:bg-blue-50/30 transition-colors">
                                         <input type="checkbox" class="w-3 h-3 rounded border-gray-300 text-primary focus:ring-primary cursor-pointer">
                                         <span class="text-[14px] text-gray-700">全选</span>
                                     </label>
                                  </div>
                                  <div class="flex items-center gap-4 flex-wrap">
                                     <label class="flex items-center gap-2 cursor-pointer">
                                         <input type="checkbox" class="w-3 h-3 rounded border-gray-300 text-primary focus:ring-primary cursor-pointer">
                                         <span class="text-[14px] font-bold text-gray-800">栅格</span>
                                     </label>
                                     <label class="flex items-center gap-2 cursor-pointer border border-gray-300 rounded-md px-4 py-1.5 bg-white hover:border-primary hover:bg-blue-50/30 transition-colors">
                                         <input type="checkbox" class="w-3 h-3 rounded border-gray-300 text-primary focus:ring-primary cursor-pointer">
                                         <span class="text-[14px] text-gray-700">TIF</span>
                                     </label>
                                     <label class="flex items-center gap-2 cursor-pointer border border-gray-300 rounded-md px-4 py-1.5 bg-white hover:border-primary hover:bg-blue-50/30 transition-colors">
                                         <input type="checkbox" class="w-3 h-3 rounded border-gray-300 text-primary focus:ring-primary cursor-pointer">
                                         <span class="text-[14px] text-gray-700">IMG</span>
                                     </label>
                                  </div>
                                  <div class="flex items-center gap-4 flex-wrap">
                                     <label class="flex items-center gap-2 cursor-pointer">
                                         <input type="checkbox" class="w-3 h-3 rounded border-gray-300 text-primary focus:ring-primary cursor-pointer">
                                         <span class="text-[14px] font-bold text-gray-800">矢量</span>
                                     </label>
                                     <label class="flex items-center gap-2 cursor-pointer border border-gray-300 rounded-md px-4 py-1.5 bg-white hover:border-primary hover:bg-blue-50/30 transition-colors">
                                         <input type="checkbox" checked class="w-3 h-3 rounded border-gray-300 text-primary focus:ring-primary cursor-pointer">
                                         <span class="text-[14px] text-gray-700">Shapefile</span>
                                     </label>
                                     <label class="flex items-center gap-2 cursor-pointer border border-gray-300 rounded-md px-4 py-1.5 bg-white hover:border-primary hover:bg-blue-50/30 transition-colors">
                                         <input type="checkbox" checked class="w-3 h-3 rounded border-gray-300 text-primary focus:ring-primary cursor-pointer">
                                         <span class="text-[14px] text-gray-700">GeoJSON</span>
                                     </label>
                                  </div>
                                  <div class="flex items-center gap-4 flex-wrap">
                                     <label class="flex items-center gap-2 cursor-pointer">
                                         <input type="checkbox" class="w-3 h-3 rounded border-gray-300 text-primary focus:ring-primary cursor-pointer">
                                         <span class="text-[14px] font-bold text-gray-800">三维模型</span>
                                     </label>
                                     <label class="flex items-center gap-2 cursor-pointer border border-gray-300 rounded-md px-4 py-1.5 bg-white hover:border-primary hover:bg-blue-50/30 transition-colors">
                                         <input type="checkbox" class="w-3 h-3 rounded border-gray-300 text-primary focus:ring-primary cursor-pointer">
                                         <span class="text-[14px] text-gray-700">OSGB</span>
                                     </label>
                                     <label class="flex items-center gap-2 cursor-pointer border border-gray-300 rounded-md px-4 py-1.5 bg-white hover:border-primary hover:bg-blue-50/30 transition-colors">
                                         <input type="checkbox" class="w-3 h-3 rounded border-gray-300 text-primary focus:ring-primary cursor-pointer">
                                         <span class="text-[14px] text-gray-700">OBJ</span>
                                     </label>
                                     <label class="flex items-center gap-2 cursor-pointer border border-gray-300 rounded-md px-4 py-1.5 bg-white hover:border-primary hover:bg-blue-50/30 transition-colors">
                                         <input type="checkbox" class="w-3 h-3 rounded border-gray-300 text-primary focus:ring-primary cursor-pointer">
                                         <span class="text-[14px] text-gray-700">GLTF</span>
                                     </label>
                                     <label class="flex items-center gap-2 cursor-pointer border border-gray-300 rounded-md px-4 py-1.5 bg-white hover:border-primary hover:bg-blue-50/30 transition-colors">
                                         <input type="checkbox" class="w-3 h-3 rounded border-gray-300 text-primary focus:ring-primary cursor-pointer">
                                         <span class="text-[14px] text-gray-700">FBX</span>
                                     </label>
                                     <label class="flex items-center gap-2 cursor-pointer border border-gray-300 rounded-md px-4 py-1.5 bg-white hover:border-primary hover:bg-blue-50/30 transition-colors">
                                         <input type="checkbox" class="w-3 h-3 rounded border-gray-300 text-primary focus:ring-primary cursor-pointer">
                                         <span class="text-[14px] text-gray-700">GLB</span>
                                     </label>
                                  </div>
                                  <div class="flex items-center gap-4 flex-wrap">
                                     <label class="flex items-center gap-2 cursor-pointer">
                                         <input type="checkbox" class="w-3 h-3 rounded border-gray-300 text-primary focus:ring-primary cursor-pointer">
                                         <span class="text-[14px] font-bold text-gray-800">瓦片</span>
                                     </label>
                                     <label class="flex items-center gap-2 cursor-pointer border border-gray-300 rounded-md px-4 py-1.5 bg-white hover:border-primary hover:bg-blue-50/30 transition-colors">
                                         <input type="checkbox" class="w-3 h-3 rounded border-gray-300 text-primary focus:ring-primary cursor-pointer">
                                         <span class="text-[14px] text-gray-700">MBTiles</span>
                                     </label>
                                     <label class="flex items-center gap-2 cursor-pointer border border-gray-300 rounded-md px-4 py-1.5 bg-white hover:border-primary hover:bg-blue-50/30 transition-colors">
                                         <input type="checkbox" class="w-3 h-3 rounded border-gray-300 text-primary focus:ring-primary cursor-pointer">
                                         <span class="text-[14px] text-gray-700">XYZ Tiles</span>
                                     </label>
                                  </div>
                                  <div class="flex items-center gap-4 flex-wrap">
                                     <label class="flex items-center gap-2 cursor-pointer">
                                         <input type="checkbox" class="w-3 h-3 rounded border-gray-300 text-primary focus:ring-primary cursor-pointer">
                                         <span class="text-[14px] font-bold text-gray-800">三维瓦片</span>
                                     </label>
                                     <label class="flex items-center gap-2 cursor-pointer border border-gray-300 rounded-md px-4 py-1.5 bg-white hover:border-primary hover:bg-blue-50/30 transition-colors">
                                         <input type="checkbox" class="w-3 h-3 rounded border-gray-300 text-primary focus:ring-primary cursor-pointer">
                                         <span class="text-[14px] text-gray-700">Cesium 3DTiles</span>
                                     </label>
                                     <label class="flex items-center gap-2 cursor-pointer border border-gray-300 rounded-md px-4 py-1.5 bg-white hover:border-primary hover:bg-blue-50/30 transition-colors">
                                         <input type="checkbox" class="w-3 h-3 rounded border-gray-300 text-primary focus:ring-primary cursor-pointer">
                                         <span class="text-[14px] text-gray-700">Cesium Terrain</span>
                                     </label>
                                  </div>
                            </div>
                        </div>

                        <!-- 入库到PostGIS库 -->
                        <div class="flex items-center">
                            <label class="custom-label flex-shrink-0 pt-0.5">矢量入库目标</label>
                            <div class="flex-1">
                                <div class="flex items-center gap-4">
                                    <label class="flex items-center gap-2 cursor-pointer">
                                        <input type="checkbox" id="enablePostGIS" checked class="w-4 h-4 rounded border-gray-300 text-primary focus:ring-primary cursor-pointer">
                                        <span class="text-[14px] text-gray-700 font-medium">入库到PostGIS库</span>
                                    </label>
                                    <p class="help-text flex items-center gap-1 m-0">
                                        <i class="fa-solid fa-circle-info text-gray-400"></i>
                                        入库到PostGIS库将不保存原始Shapefile/GeoJSON文件
                                    </p>
                                </div>
                            </div>
                        </div>

                        <!-- PostGIS配置区域 -->
                        <div id="postgisConfig" class="space-y-6 pl-[100px]">
                            
                            <div class="flex items-center">
                                <label class="custom-label flex-shrink-0">数据库<span class="text-red-500 ml-1">*</span></label>
                                <div class="relative flex-1">
                                    <select id="databaseSelect" class="w-full h-9 px-3 pr-8 custom-input text-[14px] appearance-none bg-white">
                                        <option value="">请选择</option>
                                        <option value="siwei_spatial">siwei_spatial</option>
                                        <option value="swc">swc</option>
                                    </select>
                                    <i class="fa-solid fa-angle-down absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none text-[10px]"></i>
                                </div>
                            </div>

                            <div class="flex items-center">
                                <label class="custom-label flex-shrink-0">Schema<span class="text-red-500 ml-1">*</span></label>
                                <div class="relative flex-1">
                                    <select id="schemaSelect" class="w-full h-9 px-3 pr-8 custom-input text-[14px] appearance-none bg-white">
                                        <option value="">请选择</option>
                                        <option value="public">public</option> 
                                    </select>
                                    <i class="fa-solid fa-angle-down absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none text-[10px]"></i>
                                </div>
                            </div>
                            
                        </div>

                        <!-- 汇聚方式 -->
                        <div class="border-t border-dashed border-gray-200 pt-5 flex items-center gap-4">
                            <label class="custom-label flex-shrink-0 mb-0">汇聚方式</label>
                            <div class="tab-container">
                                <div class="tab">
                                    <div class="tab-item active" data-tab="auto">定时汇聚</div>
                                    <div class="tab-item" data-tab="once">一次性汇聚</div>
                                </div>
                            </div>
                            <input type="hidden" name="import_mode" value="auto" id="importMode">
                        </div>

                        <!-- 结束类型 -->
                        <div class="flex items-center">
                            <label class="custom-label flex-shrink-0">结束类型</label>
                            <div class="relative flex-1">
                                <select class="w-full h-9 px-3 pr-8 custom-input text-[14px] appearance-none bg-white">
                                    <option value="">请选择</option>
                                    <option value="vector">定时结束</option>
                                    <option value="raster">永不结束</option>
                                </select>
                                <i class="fa-solid fa-angle-down absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none text-[10px]"></i>
                            </div>
                        </div>

                        <!-- 开始时间 -->
                        <div class="flex items-center">
                            <label class="custom-label flex-shrink-0">开始时间</label>
                            <input type="datetime-local" value="2026-04-21T14:34:13" class="flex-1 h-9 px-3 custom-input text-[14px]">
                        </div>

                        <!-- 结束时间 -->
                        <div class="flex items-center">
                            <label class="custom-label flex-shrink-0">结束时间</label>
                            <input type="datetime-local" placeholder="请选择结束时间" class="flex-1 h-9 px-3 custom-input text-[14px]">
                            <span class="ml-3 text-gray-500 text-sm">（可选，不填写则持续执行）</span>
                        </div>

                        <!-- 更新频率 -->
                        <div class="flex items-center">
                            <label class="custom-label flex-shrink-0">更新频率</label>
                            <div class="flex items-center gap-3">
                                <input type="number" value="1" class="w-16 h-9 px-3 custom-input text-[14px] text-center">
                                <div class="relative">
                                    <select class="h-9 px-3 pr-8 custom-input text-[14px] appearance-none bg-white">
                                        <option value="hours">小时</option>
                                        <option value="days">天</option>
                                        <option value="weeks">周</option>
                                        <option value="months">月</option>
                                    </select>
                                    <i class="fa-solid fa-angle-down absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none text-[10px]"></i>
                                </div>
                            </div>
                        </div>

                        <!-- 是否启用 -->
                        <div class="flex items-center">
                            <label class="custom-label flex-shrink-0">是否启用</label>
                            <div class="flex items-center gap-6">
                                <label class="flex items-center gap-2 cursor-pointer">
                                    <input type="radio" name="encryption" value="yes" checked class="w-4 h-4 rounded border-gray-300 text-primary focus:ring-primary cursor-pointer">
                                    <span class="text-[14px] text-gray-700">是</span>
                                </label>
                                <label class="flex items-center gap-2 cursor-pointer">
                                    <input type="radio" name="encryption" value="no" class="w-4 h-4 rounded border-gray-300 text-primary focus:ring-primary cursor-pointer">
                                    <span class="text-[14px] text-gray-700">否</span>
                                </label>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- 操作按钮 - 固定底部 -->
                <div class="flex-shrink-0 bg-white border-t border-gray-100 p-6 rounded-b-md">
                    <div class="flex justify-start space-x-3">
                        <button class="px-5 py-1.5 bg-primary hover:bg-blue-600 text-white rounded-[2px] text-[13px] transition-all shadow-sm w-28">
                            确认
                        </button>
                        <button class="px-5 py-1.5 bg-white border border-gray-300 rounded-[2px] text-[13px] text-gray-700 hover:bg-gray-50 transition-all w-28">
                            取消
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // 入库到PostGIS库 复选框控制逻辑
        const enablePostGIS = document.getElementById('enablePostGIS');
        const postgisConfig = document.getElementById('postgisConfig');
        const databaseSelect = document.getElementById('databaseSelect');
        const schemaSelect = document.getElementById('schemaSelect');

        // 初始化状态
        updatePostGISState();

        enablePostGIS.addEventListener('change', function() {
            updatePostGISState();
        });

        function updatePostGISState() {
            if (enablePostGIS.checked) {
                postgisConfig.style.opacity = '1';
                postgisConfig.style.pointerEvents = 'auto';
                databaseSelect.disabled = false;
                databaseSelect.classList.remove('opacity-50', 'cursor-not-allowed', 'bg-gray-100');
                schemaSelect.disabled = false;
                schemaSelect.classList.remove('opacity-50', 'cursor-not-allowed', 'bg-gray-100');
            } else {
                postgisConfig.style.opacity = '0.4';
                postgisConfig.style.pointerEvents = 'none';
                databaseSelect.disabled = true;
                databaseSelect.classList.add('opacity-50', 'cursor-not-allowed', 'bg-gray-100');
                schemaSelect.disabled = true;
                schemaSelect.classList.add('opacity-50', 'cursor-not-allowed', 'bg-gray-100');
            }
        }

        // Tab页切换逻辑
        document.querySelectorAll('.tab-item').forEach(tab => {
            tab.addEventListener('click', function() {
                // 获取当前tab所属的tab容器
                const tabContainer = this.closest('.tab-container');
                // 移除所有tab的active类
                tabContainer.querySelectorAll('.tab-item').forEach(item => {
                    item.classList.remove('active');
                });
                // 添加active类到当前tab
                this.classList.add('active');
                
                // 更新隐藏输入框的值
                const tabValue = this.getAttribute('data-tab');
                if (this.closest('.tab-container').previousElementSibling && this.closest('.tab-container').previousElementSibling.tagName === 'LABEL') {
                    const labelText = this.closest('.tab-container').previousElementSibling.textContent.trim();
                    if (labelText === '入库数据类型') {
                        document.getElementById('importType').value = tabValue;
                    } else if (labelText === '汇聚方式') {
                        document.getElementById('importMode').value = tabValue;
                    }
                }
            });
        });

        // 检测格式勾选变化，控制"入库到PostGIS库"可用性
        document.querySelectorAll('#detectFormatContainer input[type="checkbox"]').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                updatePostGISAvailability();
            });
        });

        function updatePostGISAvailability() {
            let shapefileChecked = false;
            let geojsonChecked = false;
            
            document.querySelectorAll('#detectFormatContainer input[type="checkbox"]').forEach(cb => {
                const label = cb.closest('label');
                const span = label.querySelector('span');
                if (span && span.textContent.includes('Shapefile')) {
                    shapefileChecked = cb.checked;
                }
                if (span && span.textContent.includes('GeoJSON')) {
                    geojsonChecked = cb.checked;
                }
            });
            
            const enablePostGIS = document.getElementById('enablePostGIS');
            
            if (!shapefileChecked && !geojsonChecked) {
                enablePostGIS.disabled = true;
                enablePostGIS.checked = false;
                enablePostGIS.parentElement.parentElement.classList.add('opacity-50', 'cursor-not-allowed');
                updatePostGISState();
            } else {
                enablePostGIS.disabled = false;
                enablePostGIS.parentElement.parentElement.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        // 初始化时执行一次
        updatePostGISAvailability();
    </script>
</body>
</html>
