<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PostGIS 数据导出 - 四维云行业通用软件</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1890ff',
                        header: '#ffffff',
                        sidebar: '#001529',
                        main: '#f0f2f5',
                        border: '#e8e8e8'
                    }
                }
            }
        }
    </script>
    <style>
        body { min-width: 1200px; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .custom-input {
            border: 1px solid #d9d9d9;
            border-radius: 2px;
            transition: all 0.3s;
        }
        .custom-input:focus {
            border-color: #40a9ff;
            box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.2);
            outline: none;
        }
        .custom-input:disabled {
            background-color: #f5f5f5;
            cursor: not-allowed;
            color: rgba(0, 0, 0, 0.25);
        }
        .custom-label {
            width: 140px;
            color: rgba(0, 0, 0, 0.85);
            font-size: 14px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body class="h-screen flex flex-col font-sans text-sm text-gray-700 bg-main overflow-hidden">

    <header class="h-16 bg-header text-gray-800 flex items-center justify-between px-6 flex-shrink-0 shadow-sm z-20 border-b border-gray-200">
        <div class="flex items-center gap-2.5 w-72">
            <div class="w-10 h-10 text-primary flex items-center justify-center text-[34px]">
                <i class="fa-solid fa-earth-americas"></i>
            </div>
            <div class="flex flex-col justify-center">
                <span class="text-[17px] font-black tracking-wide text-gray-800 leading-tight">四维云行业通用软件</span>
                <span class="text-[11px] font-bold tracking-[0.25em] text-gray-800 leading-tight mt-0.5">时空数据管理</span>
            </div>
        </div>

        <nav class="flex-1 px-8 h-full">
            <ul class="flex h-full items-center gap-10 font-medium text-[16px]">
                <li class="h-full flex items-center text-primary cursor-pointer px-3 border-b-2 border-primary bg-blue-50/50 transition-colors font-semibold">数据汇聚</li>
                <li class="h-full flex items-center text-gray-600 hover:text-primary cursor-pointer px-3 border-b-2 border-transparent hover:border-primary transition-colors">数据管理</li>
                <li class="h-full flex items-center text-gray-600 hover:text-primary cursor-pointer px-3 border-b-2 border-transparent hover:border-primary transition-colors">数据查询</li>
                <li class="h-full flex items-center text-gray-600 hover:text-primary cursor-pointer px-3 border-b-2 border-transparent hover:border-primary transition-colors">数据处理</li>
                <li class="h-full flex items-center text-gray-600 hover:text-primary cursor-pointer px-3 border-b-2 border-transparent hover:border-primary transition-colors">服务管理</li>
                <li class="h-full flex items-center text-gray-600 hover:text-primary cursor-pointer px-3 border-b-2 border-transparent hover:border-primary transition-colors">数据可视化</li>
            </ul>
        </nav>

        <div class="flex items-center gap-6">
            <a href="#" class="text-primary transition-colors flex items-center gap-1.5 text-[14px]">
                更多 <i class="fa-solid fa-angle-down text-[10px]"></i>
            </a>
            <div class="flex items-center gap-3 cursor-pointer hover:bg-gray-50 py-1.5 px-3 rounded-full border border-transparent hover:border-gray-200 transition-all">
                <span class="text-gray-700 font-medium text-[14px]">admin</span>
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Admin" alt="User" class="w-7 h-7 rounded-full bg-gray-200 border border-gray-300 shadow-sm">
            </div>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        
        <aside class="w-64 bg-sidebar text-gray-300 flex flex-col flex-shrink-0 z-10 shadow-lg overflow-y-auto">
            <div class="py-4">
                <ul class="flex flex-col w-full">
                    
                    <li class="w-full">
                        <a href="#" class="block pl-[52px] pr-6 py-3 text-[14px] text-gray-400 hover:text-white hover:bg-primary/10 transition-colors">
                            <i class="fa-solid fa-tasks w-5 text-center mr-3"></i>汇聚任务
                        </a>
                    </li>

                    <li class="w-full">
                        <a href="#" class="block pl-[52px] pr-6 py-3 text-[14px] text-gray-400 hover:text-white hover:bg-primary/10 transition-colors">
                            <i class="fa-solid fa-upload w-5 text-center mr-3"></i>文件上传
                        </a>
                    </li>

                    <li class="w-full">
                        <a href="#" class="block pl-[52px] pr-6 py-3 text-[14px] text-white bg-primary/30 border-r-4 border-primary font-medium tracking-wide">
                            <i class="fa-solid fa-download w-5 text-center mr-3"></i>数据下载
                        </a>
                    </li>

                </ul>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto p-6 flex flex-col">
            
            <div class="flex-1 bg-white rounded-sm shadow-sm border border-gray-200 flex flex-col min-h-full">
                
                <div class="px-6 py-4 border-b border-gray-100">
                    <h2 class="text-[16px] font-bold text-gray-800">创建下载任务</h2>
                </div>

                <div class="flex-1 p-8 overflow-y-auto">
                    <div class="max-w-4xl">
                        <form class="space-y-6">
                            
                            <div class="space-y-6 pb-6 border-b border-gray-100">
                                
                                <div class="flex items-center">
                                    <label class="custom-label flex-shrink-0">数据名称<span class="text-red-500 ml-1">*</span></label>
                                    <input type="text" value="buildings_2024" disabled class="w-[360px] h-9 px-3 custom-input text-[14px] bg-gray-50 cursor-not-allowed">
                                </div>

                                <div class="flex items-center">
                                    <label class="custom-label flex-shrink-0">导出格式<span class="text-red-500 ml-1">*</span></label>
                                    <div class="flex gap-6">
                                        <div class="radio-option">
                                            <input type="radio" id="format-csv" name="export_format" value="csv" class="text-primary focus:ring-primary">
                                            <label for="format-csv" class="cursor-pointer text-sm text-gray-700">CSV</label>
                                        </div>
                                        <div class="radio-option">
                                            <input type="radio" id="format-shp" name="export_format" value="shp" checked class="text-primary focus:ring-primary">
                                            <label for="format-shp" class="cursor-pointer text-sm text-gray-700">Shapefile</label>
                                        </div>
                                        <div class="radio-option">
                                            <input type="radio" id="format-geojson" name="export_format" value="geojson" class="text-primary focus:ring-primary">
                                            <label for="format-geojson" class="cursor-pointer text-sm text-gray-700">GeoJSON</label>
                                        </div>
                                    </div>
                                </div>

                            </div>

                        </form>
                    </div>
                </div>

                <div class="px-8 py-6 border-t border-gray-100 bg-white flex justify-end">
                    <div class="flex gap-3">
                        <button class="bg-primary hover:bg-blue-600 text-white px-8 py-1.5 rounded-[2px] text-[14px] transition-all shadow-sm">
                            确认
                        </button>
                        <button class="bg-white hover:bg-gray-50 text-gray-600 px-8 py-1.5 border border-gray-300 rounded-[2px] text-[14px] transition-all">
                            取消
                        </button>
                    </div>
                </div>
            </div>

        </main>
    </div>

</body>
</html>
